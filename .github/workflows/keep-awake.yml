name: Keep Streamlit demo awake

# Streamlit Community Cloud puts an app to sleep after a few hours without
# traffic, and a recruiter then lands on a "Zzzz… wake it up" screen. A plain
# curl does not wake it: the wake-up is a button on that page. So a headless
# browser opens the app every 6 hours and presses the button if it is shown.
# (GitHub pauses scheduled workflows after 60 days without a commit — re-enable
# from the Actions tab if that happens.)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

env:
  APP_URL: https://walmart-sales-forecasting-skay.streamlit.app

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Open the app and wake it if asleep
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=90_000)
              page.wait_for_timeout(8_000)
              button = page.get_by_role("button", name="Yes, get this app back up!")
              if button.count():
                  button.click()
                  print("App was asleep: wake-up requested")
                  page.wait_for_timeout(60_000)
              else:
                  print("App was already awake")
          PY
